name: Build fakeAka Kernel (POCO F4 munch)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

jobs:
  build:
    name: Build fakeAka Kernel
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf libelf-dev libncurses-dev libssl-dev lz4 lzop \
            make ninja-build optipng python3 libxml2 libxml2-utils rsync \
            squashfs-tools tar unzip zip zlib1g-dev cpio kmod zstd wget libncurses6

      - name: Download Neutron Clang Toolchain
        run: |
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst -O clang.tar.zst
          mkdir -p clang
          unzstd -d clang.tar.zst
          tar -xf clang.tar -C clang
          rm -f clang.tar clang.tar.zst

      - name: Clone sm8250 Kernel Source (flos-personal)
        run: |
          git clone --depth=1 --branch flos-personal https://github.com/re-noroi/kernel_sm8250.git kernel

      - name: Apply fakeAka Customizations & Optimizations
        run: |
          cd kernel

          # Mencegah git dirty "+" atau sha suffix pada kernel version
          touch .scmversion

          # 1. Atur Nama Kernel fakeAka
          sed -i 's/CONFIG_LOCALVERSION="-FakeDreamer"/CONFIG_LOCALVERSION="-fakeAka"/' arch/arm64/configs/vendor/munch_defconfig
          chmod +x ./scripts/config
          ./scripts/config --file arch/arm64/configs/vendor/munch_defconfig --disable CONFIG_LOCALVERSION_AUTO
          ./scripts/config --file arch/arm64/configs/vendor/munch_defconfig --set-str CONFIG_LOCALVERSION "-fakeAka"

          # 2. Strip incompatible MLGO flags for Neutron Clang
          sed -i -e '/regalloc-enable-advisor/s/^/#/' -e '/enable-ml-inliner/s/^/#/' -e '/ml-inliner-model-selector/s/^/#/' Makefile

          # 3. Aktifkan Fitur fakeAka di munch_defconfig
          ./scripts/config --file arch/arm64/configs/vendor/munch_defconfig --enable CONFIG_KSU
          ./scripts/config --file arch/arm64/configs/vendor/munch_defconfig --enable CONFIG_TCP_CONG_BBR
          ./scripts/config --file arch/arm64/configs/vendor/munch_defconfig --enable CONFIG_DEFAULT_BBR
          ./scripts/config --file arch/arm64/configs/vendor/munch_defconfig --set-str CONFIG_DEFAULT_TCP_CONG "bbr"
          ./scripts/config --file arch/arm64/configs/vendor/munch_defconfig --enable CONFIG_LTO_CLANG_THIN
          ./scripts/config --file arch/arm64/configs/vendor/munch_defconfig --disable CONFIG_LTO_CLANG_FULL

          # 4. Anti-Tekor Charging Floor: cegah charging drop di bawah 2.5A saat suhu naik
          sed -i '/if (chip->cold_step_chg_cfg_valid)/i \	if (fcc_ua > 0 && fcc_ua < 2500000) fcc_ua = 2500000;' drivers/power/supply/qcom/step-chg-jeita.c

          # 5. Pastikan spoof uname 5.15.190 untuk bpfloader/netbpfload/netd di Android 16 aktif
          grep -q "5.15.190" kernel/sys.c && echo "BPF uname spoof 5.15.190 verified!"

      - name: Compile fakeAka Kernel
        run: |
          cd kernel
          export PATH="${{ github.workspace }}/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=ARM64
          export KBUILD_BUILD_USER="fakeAka"
          export KBUILD_BUILD_HOST="AkaLab"
          export KBUILD_BUILD_TIMESTAMP="$(date -u)"

          # 1. Defconfig munch
          make O=out vendor/munch_defconfig

          # 2. Build kernel dengan Clang + LLD penuh (LLVM=1 LLVM_IAS=1)
          make -j$(nproc --all) O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1

      - name: Package with AnyKernel3 (munch branch)
        run: |
          git clone --depth=1 --branch munch https://github.com/re-noroi/anykernel3-test.git AnyKernel3
          cd AnyKernel3

          # Sesuaikan nama kernel di script AnyKernel3
          sed -i 's/kernel.string=.*/kernel.string=fakeAka Kernel for POCO F4 (munch) by Aka/g' anykernel.sh

          # Salin artefak kernel yang sudah dikompilasi
          cp ../kernel/out/arch/arm64/boot/Image.gz .
          cp ../kernel/out/arch/arm64/boot/dtbo.img ./munch-aosp-dtbo.img
          cp ../kernel/out/arch/arm64/boot/dtb.img ./munch-normal-gpustk-dtb
          touch ./aosp-normal-gpustk.dreamless

          # Buat file zip flashable
          BUILD_DATE=$(date +'%Y%m%d')
          zip -r9 "../fakeAka-Kernel-munch-${BUILD_DATE}.zip" * -x .git README.md

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fakeAka-Kernel-munch-package
          path: |
            fakeAka-Kernel-munch-*.zip
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/dtbo.img
            kernel/out/arch/arm64/boot/dtb.img
